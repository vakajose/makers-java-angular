server:
  port: 8080

spring:
  application:
    name: loans-api
  datasource:
    url: jdbc:h2:mem:loansdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: caffeine
    cache-names: loans
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

app:
  jwt:
    secret: ${JWT_SECRET:bWFrZXJzLWxvYW5zLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHktMjU2Yml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
