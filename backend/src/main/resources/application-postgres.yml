spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loansdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:loans_user}
    password: ${DB_PASSWORD:loans_pass}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
